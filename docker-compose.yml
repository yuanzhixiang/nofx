networks:
  traefik:
    external: true

services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./config.db:/app/config.db
      - ./decision_logs:/app/decision_logs
      - ./prompts:/app/prompts
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
    networks:
      - traefik

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      - nofx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nofx-frontend.rule=Host(`${NOFX_DOMAIN}`)"
      - "traefik.http.services.nofx-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"